name: Sync

on:
  schedule:
    # 01:00 UTC = 09:00 Beijing.
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Serialize runs so a manual dispatch and the schedule never race on the
# commit-back of images and index.json.
concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the Sync
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: pnpm sync
      - name: Commit images and index.json if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images index.json
          if ! git diff --cached --quiet; then
            added=$(git diff --cached --diff-filter=A --name-only -- images/ | wc -l)
            updated=$(git diff --cached --diff-filter=M --name-only -- images/ | wc -l)
            git commit -m "Sync: add $added, update $updated image(s)"
            git push
          else
            echo "Nothing changed; nothing to commit."
          fi
